plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.projeto_interdiciplinar'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.projeto_interdiciplinar"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // --- DEPENDÊNCIAS ADICIONADAS PARA COMUNICAÇÃO COM A API ---

    // Retrofit: Biblioteca para fazer as chamadas HTTP para o seu backend
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'

    // Gson Converter: Converte os objetos JSON da API em objetos Java/Kotlin e vice-versa
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // Opcional, mas muito recomendado: Interceptor para ver os logs das requisições no Logcat
    // Ajuda a identificar problemas na comunicação com a API
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'

    // -----------------------------------------------------------
}